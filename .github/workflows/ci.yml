name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: stint-ci-scaffold-not-connected

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      non_runtime_only: ${{ steps.classify.outputs.non_runtime_only }}
      database_sensitive: ${{ steps.classify.outputs.database_sensitive }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run classifier self-tests
        run: node --test scripts/ci/classify-change.test.mjs

      - name: Determine changed files and classify CI tier
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          echo "Classifying change range $BASE_SHA..$HEAD_SHA"
          node scripts/ci/classify-change.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  quality:
    name: Format, lint, typecheck, test, build, e2e
    needs: classify
    if: needs.classify.outputs.non_runtime_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom@30 / undici require a current Node; local development uses 22.x
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm from packageManager
        run: corepack prepare pnpm@8.15.4 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke
        run: pnpm test:e2e

  database:
    name: Schema and RLS
    needs: classify
    if: >
      needs.classify.outputs.non_runtime_only != 'true' &&
      needs.classify.outputs.database_sensitive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm from packageManager
        run: corepack prepare pnpm@8.15.4 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Reset local database (apply migrations)
        run: pnpm supabase:db:reset

      - name: Run schema and RLS tests
        run: pnpm supabase:test:db

      - name: Profile-row completion lock proof (two Postgres connections)
        run: pnpm test:db:lock

      - name: Verify generated database types
        run: pnpm db:types:check

      - name: Export local Supabase env for Auth journey
        id: supabase-env
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "MAILPIT_API_URL=http://127.0.0.1:54324/api/v1"
            echo "E2E_AUTH_JOURNEY=1"
          } >> "$GITHUB_ENV"

      - name: Production build (local Supabase)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright WebKit (Unit I / I-05 mobile-Safari-equivalent smoke)
        run: pnpm exec playwright install --with-deps webkit

      - name: Auth, onboarding, and completion journeys (local Supabase + Mailpit)
        run: pnpm test:e2e:onboarding

      - name: Publication readiness and matching integrity journeys (local Supabase + Mailpit)
        run: pnpm test:e2e:publication-matching-integrity

      - name: Candidate navigation and account IA journeys (local Supabase + Mailpit)
        run: pnpm test:e2e:candidate-navigation-ia

      - name: Employer navigation IA journeys (local Supabase + Mailpit)
        run: pnpm test:e2e:employer-navigation-ia

      - name: Employer responsive layout regression (local Supabase + Mailpit)
        run: pnpm exec playwright test --workers=1 e2e/employer-responsive-layout.spec.ts

      - name: WebKit/mobile navigation IA smoke — Unit I / I-05 (local Supabase + Mailpit)
        run: pnpm test:e2e:webkit-smoke

      - name: Password recovery journeys (local Supabase + Mailpit)
        run: pnpm test:e2e:password-recovery

      - name: Application outcome events journeys (local Supabase + Mailpit)
        run: pnpm test:e2e:outcome-events

      - name: Employer application outcome UI journeys (local Supabase + Mailpit)
        run: pnpm test:e2e:outcome-ui

      - name: M5 Founder metrics authorization journey (local Supabase + Mailpit)
        run: pnpm test:e2e:metrics

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
