splay';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b8900e63-7175-4d4f-8c5e-b18019c9270a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Serif Display';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"74734115-c647-4bbe-9a97-5cf3fcbfbc07\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ---- Tokens -------------------------------------------------------------- */\n:root {\n  /* Core palette (oklch) */\n  --paper: oklch(0.955 0.018 75);            /* warm off-white background */\n  --ink: oklch(0.2 0.02 30);                 /* near-black foreground */\n  --ink-72: oklch(0.2 0.02 30 / 72%);        /* body text */\n  --ink-55: oklch(0.45 0.02 30);             /* muted / secondary */\n  --ink-40: oklch(0.55 0.015 30);            /* tertiary / captions */\n  --ink-20: oklch(0.2 0.02 30 / 20%);        /* placeholder text */\n\n  --paper-strong: oklch(1 0 0);              /* pure white, card face */\n  --paper-soft: oklch(0.96 0.015 75);        /* secondary surface */\n  --paper-muted: oklch(0.94 0.01 75);        /* subtle wash */\n\n  --oxblood: oklch(0.38 0.13 20);            /* primary action */\n  --oxblood-strong: oklch(0.3 0.12 20);      /* hover state */\n  --oxblood-fg: oklch(1 0 0);                /* text on oxblood */\n\n  --clay: oklch(0.5 0.09 35);                /* secondary accent (eyebrows, pill text) */\n  --clay-fg: oklch(1 0 0);\n  --soft: oklch(0.92 0.04 75);               /* accent-soft / peach wash */\n\n  --olive: oklch(0.52 0.11 75);              /* success - deliberately desaturated */\n  --olive-soft: oklch(0.52 0.11 75 / 12%);\n\n  --border: oklch(0.9 0.015 75);             /* default border */\n  --border-strong: oklch(0.84 0.015 75);     /* input & divider border */\n\n  /* Semantic aliases (match codebase) */\n  --background: var(--paper);\n  --foreground: var(--ink);\n  --primary: var(--oxblood);\n  --primary-foreground: var(--oxblood-fg);\n  --accent: var(--clay);\n  --accent-foreground: var(--clay-fg);\n  --accent-soft: var(--soft);\n  --muted: var(--paper-muted);\n  --muted-foreground: var(--ink-55);\n  --surface: oklch(1 0 0 / 72%);\n  --surface-strong: var(--paper-strong);\n  --surface-muted: oklch(0.94 0.01 75 / 50%);\n  --card: var(--paper-strong);\n  --card-foreground: var(--ink);\n  --success: var(--olive);\n  --destructive: oklch(0.55 0.22 25);\n  --ring: var(--oxblood);\n\n  /* Radii */\n  --radius: 0.75rem;                         /* 12px — base */\n  --radius-sm: calc(var(--radius) - 4px);    /* 8px */\n  --radius-md: var(--radius);                /* 12px */\n  --radius-lg: calc(var(--radius) + 4px);    /* 16px */\n  --radius-xl: calc(var(--radius) + 10px);   /* 22px */\n  --radius-2xl: 30px;                        /* product stage */\n  --radius-3xl: 34px;                        /* product stage (detail) */\n\n  /* Shadows */\n  --shadow-sm: 0 2px 8px oklch(0.3 0.02 30 / 6%);\n  --shadow-md: 0 12px 36px oklch(0.3 0.02 30 / 10%);\n  --shadow-lg: 0 22px 70px oklch(0.3 0.02 30 / 14%);\n  --shadow-product: 0 20px 56px rgb(47 33 29 / 0.12), 0 1px 0 rgb(255 255 255 / 0.75) inset;\n  --shadow-product-hover: 0 28px 76px rgb(47 33 29 / 0.16);\n\n  /* Spacing (8pt grid) */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-7: 32px;\n  --space-8: 40px;\n  --space-9: 56px;\n  --space-10: 72px;\n\n  /* Type */\n  --font-sans: \"DM Sans\", system-ui, -apple-system, sans-serif;\n  --font-serif: \"DM Serif Display\", Georgia, serif;\n  --font-mono: \"SFMono-Regular\", \"SF Mono\", Consolas, \"Liberation Mono\", Menlo, monospace;\n\n  --tracking-display: -0.05em;\n  --tracking-heading: -0.03em;\n  --tracking-body: 0;\n  --tracking-caption: -0.02em;\n  --tracking-eyebrow: 0.02em;          /* eyebrows are NOT letter-spaced wide in MaM */\n  --tracking-button-sm: 0.12em;\n  --tracking-button-lg: 0.14em;\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);\n  --dur-xs: 160ms;\n  --dur-sm: 200ms;\n  --dur-md: 320ms;\n  --dur-lg: 360ms;\n  --dur-xl: 460ms;\n\n  /* App shell gradient (paper wash) */\n  --paper-wash:\n    radial-gradient(circle at top, oklch(0.38 0.13 20 / 10%), transparent 34%),\n    linear-gradient(180deg, oklch(1 0 0 / 12%), transparent 24%),\n    var(--paper);\n}\n\n/* ---- Base elements ------------------------------------------------------- */\nhtml {\n  background: var(--paper-wash);\n  color: var(--foreground);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: 1.7;\n  color: var(--foreground);\n  min-height: 100vh;\n}\n\n::selection {\n  background: var(--accent-soft);\n  color: var(--ink);\n}\n\n/* ---- Semantic type ------------------------------------------------------- */\nh1, .h1 {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: clamp(2.5rem, 4vw + 1rem, 3.75rem);\n  line-height: 0.98;\n  letter-spacing: var(--tracking-display);\n  color: var(--foreground);\n  margin: 0;\n}\n\nh2, .h2 {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: clamp(1.75rem, 2vw + 1rem, 2rem);\n  line-height: 1.1;\n  letter-spacing: -0.04em;\n  color: var(--foreground);\n  margin: 0;\n}\n\nh3, .h3 {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: 1.25rem;\n  line-height: 1.3;\n  letter-spacing: var(--tracking-heading);\n  color: var(--foreground);\n  margin: 0;\n}\n\nh4, .h4 {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: 1rem;\n  line-height: 1.4;\n  letter-spacing: -0.02em;\n  color: var(--foreground);\n  margin: 0;\n}\n\np, .p {\n  font-family: var(--font-sans);\n  font-size: 0.95rem;\n  line-height: 1.75;\n  color: var(--ink-72);\n  margin: 0;\n}\n\n.lead {\n  font-size: 1.125rem;\n  line-height: 1.7;\n  color: var(--ink-72);\n}\n\nsmall, .small {\n  font-size: 0.8125rem;\n  line-height: 1.6;\n  color: var(--ink-55);\n}\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-size: 0.75rem;\n  font-weight: 600;\n  color: var(--accent);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: none;             /* MaM eyebrows are NOT uppercased */\n  margin: 0;\n}\n\n.caption {\n  font-size: 0.6875rem;\n  font-weight: 600;\n  color: var(--ink-40);\n  letter-spacing: 0;\n}\n\n.wordmark {\n  font-family: var(--font-serif);\n  font-weight: 400;\n  font-size: 1.125rem;\n  line-height: 1;\n  letter-spacing: -0.02em;\n  color: var(--foreground);\n}\n\ncode, kbd, samp, .mono {\n  font-family: var(--font-mono);\n  font-size: 0.875em;\n  color: var(--ink-55);\n}\n\n/* ---- Surfaces ------------------------------------------------------------ */\n.panel-surface {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-md);\n  backdrop-filter: blur(18px);\n  -webkit-backdrop-filter: blur(18px);\n  transition:\n    transform var(--dur-sm) ease,\n    box-shadow var(--dur-sm) ease,\n    border-color var(--dur-sm) ease,\n    background-color var(--dur-sm) ease;\n}\n\n.panel-surface--accent-ring {\n  box-shadow:\n    var(--shadow-md),\n    inset 0 0 0 1px oklch(1 0 0 / 15%);\n}\n\n.product-stage {\n  background: linear-gradient(180deg, rgba(255,252,249,0.98), rgba(236,226,218,0.86));\n  border-radius: var(--radius-2xl);\n  box-shadow: var(--shadow-product);\n  border: 1px solid rgb(0 0 0 / 0.08);\n}\n\n/* ---- Buttons ------------------------------------------------------------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  white-space: nowrap;\n  border-radius: 9999px;\n  border: 1px solid transparent;\n  font-family: var(--font-sans);\n  font-weight: 600;\n  text-align: center;\n  cursor: pointer;\n  transition: transform var(--dur-sm) ease, background-color var(--dur-sm) ease,\n    border-color var(--dur-sm) ease, color var(--dur-sm) ease, box-shadow var(--dur-sm) ease,\n    opacity var(--dur-sm) ease;\n  text-decoration: none;\n  min-height: 48px;\n  padding: 12px 24px;\n  font-size: 0.875rem;\n  letter-spacing: var(--tracking-button-sm);\n}\n\n.btn:hover { transform: translateY(-1px); }\n.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px oklch(0.38 0.13 20 / 20%); }\n.btn:disabled { opacity: 0.6; pointer-events: none; }\n\n.btn--primary {\n  background: var(--oxblood);\n  color: var(--oxblood-fg);\n  box-shadow: var(--shadow-md);\n}\n.btn--primary:hover { background: var(--oxblood-strong); }\n\n.btn--secondary {\n  background: var(--surface-muted);\n  color: var(--foreground);\n  border-color: var(--border-strong);\n}\n.btn--secondary:hover { background: var(--paper-strong); }\n\n.btn--ghost {\n  background: transparent;\n  color: var(--ink-72);\n  border-color: transparent;\n}\n.btn--ghost:hover {\n  background: var(--surface-muted);\n  color: var(--foreground);\n  border-color: var(--border-strong);\n}\n\n.btn--text {\n  background: transparent;\n  color: var(--oxblood);\n  border-color: transparent;\n  min-height: auto;\n  padding: 4px 0;\n  border-radius: 0;\n  letter-spacing: 0;\n}\n.btn--text:hover { text-decoration: underline; text-underline-offset: 4px; transform: none; }\n\n.btn--sm  { min-height: 40px; padding: 8px 16px; font-size: 0.75rem; }\n.btn--xs  { min-height: 32px; padding: 6px 12px; font-size: 0.6875rem; }\n.btn--lg  { min-height: 52px; padding: 14px 28px; font-size: 0.9375rem; letter-spacing: var(--tracking-button-lg); }\n\n/* ---- Pills --------------------------------------------------------------- */\n/* Pills are LABELS, not buttons. Flat, small, with a leading status dot on\n   tonal variants so they don't read as tap targets. Use .btn for actions. */\n.pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  border-radius: 6px;           /* subtle rectangle, not capsule */\n  border: 1px solid transparent;\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: 0.6875rem;          /* 11px */\n  line-height: 1;\n  padding: 4px 8px;              /* much tighter than a button */\n  letter-spacing: 0;\n  white-space: nowrap;\n  cursor: default;               /* never a pointer */\n  user-select: none;\n}\n.pill::before {\n  content: \"\";\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: currentColor;\n  flex-shrink: 0;\n  opacity: 0.7;\n}\n.pill--neutral::before { display: none; }   /* plain category chips keep no dot */\n\n.pill--accent { background: var(--accent-soft); color: var(--accent); }\n.pill--success { background: var(--olive-soft); color: var(--success); }\n.pill--neutral { background: transparent; color: var(--ink-55); border-color: var(--border); padding: 3px 8px; font-weight: 500; }\n\n/* ---- Inputs -------------------------------------------------------------- */\n.field-input {\n  appearance: none;\n  width: 100%;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius-md);\n  background: oklch(1 0 0 / 92%);\n  color: var(--foreground);\n  min-height: 52px;\n  padding: 0.9rem 1rem;\n  font: inherit;\n  transition: border-color var(--dur-xs) ease, box-shadow var(--dur-xs) ease,\n    background-color var(--dur-xs) ease;\n}\n\n.field-input::placeholder { color: var(--ink-20); }\n.field-input:focus {\n  outline: none;\n  border-color: oklch(0.38 0.13 20 / 55%);\n  box-shadow: 0 0 0 4px oklch(0.38 0.13 20 / 14%);\n  background: oklch(1 0 0);\n}\n\n/* ---- Layout helpers ------------------------------------------------------ */\n.app-shell {\n  min-height: 100vh;\n  background:\n    radial-gradient(circle at top left, oklch(0.38 0.13 20 / 8%), transparent 28%),\n    linear-gradient(180deg, oklch(1 0 0 / 12%), transparent 24%);\n}\n\n.container-narrow { max-width: 1152px; margin: 0 auto; padding: 24px 32px; }\n@media (min-width: 1024px) { .container-narrow { padding: 32px 40px; } }\n\n/* ---- Entrance animations ------------------------------------------------- */\n@keyframes fade-rise {\n  from { opacity: 0; transform: translateY(10px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n@keyframes premium-fade-rise {\n  from { opacity: 0; filter: blur(8px); transform: translateY(18px) scale(0.988); }\n  to   { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }\n}\n.soft-entrance  { animation: fade-rise var(--dur-lg) ease-out; }\n.premium-entrance {\n  opacity: 0;\n  animation: premium-fade-rise 560ms var(--ease-out) forwards;\n  animation-delay: var(--stagger-delay, 0ms);\n}\n@media (prefers-reduced-motion: reduce) {\n  .soft-entrance, .premium-entrance { animation: none; opacity: 1; filter: none; transform: none; }\n}\n<\u002Fstyle>\n  <script src=\"a4b54ed8-edd9-499b-a55a-6249e580bf02\"><\u002Fscript>\n  <style>\n    doc-page:not(:defined) { visibility: hidden; }\n    .kdoc h1, .kdoc h2, .kdoc h3, .kdoc h4 { font-family: 'DM Sans', sans-serif; color: oklch(0.2 0.02 30); }\n    .kdoc h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 4px; }\n    .kdoc h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 40px 0 4px; padding-top: 18px; border-top: 1px solid oklch(0.9 0.015 75); }\n    .kdoc h2:first-of-type { border-top: none; padding-top: 0; }\n    .kdoc h3 { font-size: 16px; font-weight: 700; margin: 20px 0 4px; color: oklch(0.38 0.13 20); }\n    .kdoc h4 { font-size: 13px; font-weight: 700; margin: 14px 0 2px; text-transform: uppercase; letter-spacing: 0.06em; color: oklch(0.5 0.07 40); }\n    .kdoc p, .kdoc li { font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.65; color: oklch(0.28 0.02 30); }\n    .kdoc .eyebrow { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: oklch(0.5 0.07 40); margin: 0; }\n    .kdoc table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0 18px; }\n    .kdoc th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: oklch(0.5 0.07 40); padding: 6px 10px 6px 0; border-bottom: 1.5px solid oklch(0.84 0.015 75); }\n    .kdoc td { padding: 8px 10px 8px 0; border-bottom: 1px solid oklch(0.9 0.015 75); vertical-align: top; }\n    .kdoc td.swatch { width: 22px; }\n    .kdoc .sw { width: 20px; height: 20px; border-radius: 5px; border: 1px solid oklch(0.84 0.015 75); display: inline-block; }\n    .kdoc .callout { background: oklch(0.965 0.015 75); border: 1px solid oklch(0.9 0.015 75); border-radius: 12px; padding: 14px 18px; margin: 10px 0 18px; break-inside: avoid; }\n    .kdoc ul, .kdoc ol { margin: 4px 0 14px; padding-left: 20px; }\n    .kdoc .tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }\n    .kdoc .tag-rename { background: oklch(0.92 0.04 90); color: oklch(0.4 0.1 90); }\n    .kdoc .tag-restyle { background: oklch(0.92 0.04 75); color: oklch(0.5 0.09 35); }\n    .kdoc .tag-restructure { background: oklch(0.9 0.06 20); color: oklch(0.38 0.13 20); }\n    .kdoc .tag-defer { background: oklch(0.9 0.015 75); color: oklch(0.45 0.02 30); }\n  <\u002Fstyle>\n\n\n<doc-page margin=\"0.85in\">\n<div class=\"kdoc\">\n\n<p class=\"eyebrow\">Design proposal — visual identity only — not implemented — for founder and Development review<\u002Fp>\n<h1>KLINNOVA design system<\u002Fh1>\n<p style=\"font-size: 15px; color: oklch(0.2 0.02 30);\">Direction C, Quiet Progress, as the primary system, with Direction A, Editorial Trust, borrowed for typographic discipline, hierarchy and employer-facing credibility. No code changes. No product scope changes.<\u002Fp>\n\n<div class=\"callout\">\n<p><strong>How to read this document.<\u002Fstrong> Sections A–R are the design system itself. Section S lists every deliverable by name. The migration matrix (Q) and open questions (final section) are what this document is <em>for<\u002Fem> — they're the decisions that need a founder or Development answer before any repository work starts.<\u002Fp>\n<\u002Fdiv>\n\n<h2 id=\"a\">A. Brand interpretation<\u002Fh2>\n<p>KLINNOVA should feel like an organization, not a startup experiment — a name with enough weight to sit next to the employers it partners with, while remaining approachable to a candidate who has never used a job platform before. The name reads more international and more permanent than Stint; it should feel <em>established<\u002Fem> rather than <em>clever<\u002Fem>.<\u002Fp>\n<p>What carries over from Stint, unchanged: the emotional core (seen, progress, dignity), the single-accent oxblood-and-paper palette, the editorial restraint, the refusal to perform \"AI,\" and the belief that motion should mean something rather than decorate. What changes is scale and posture — KLINNOVA can hold denser employer/admin surfaces and a longer product roadmap than a single-feature app, so the system needs more range without more decoration.<\u002Fp>\n<p><strong>Seen, Progress, Dignity<\u002Fstrong> still fit and should not be re-litigated with the rename — they describe the relationship between the product and the person using it, not the name on the door. <strong>Trust<\u002Fstrong> is added here as a fourth pillar specific to Klinnova's expanded employer/admin surface: Stint's trust was implicit in tone; Klinnova needs trust to be legible in the interface itself (verification, moderation, outcome history), because a heavier B2B surface invites more scrutiny.<\u002Fp>\n<p><strong>\"One step closer\"<\u002Fstrong> should evolve rather than transfer directly. It's a candidate-side line, written for one person's job search — it under-serves the employer and admin sides of Klinnova, and repeating it as a literal tagline everywhere would fight the brief's own instruction that progress should be shown, not narrated. Recommendation: retire it as the printed tagline, keep it as the internal design principle it already is (see D. Brand promise below), and let the product's structure — timelines, progress bars, lifecycle states — say it without the words.<\u002Fp>\n\n<h2 id=\"b\">B. Brand personality<\u002Fh2>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Trait<\u002Fsc-raw-th><sc-raw-th>Visually<\u002Fsc-raw-th><sc-raw-th>In product UX<\u002Fsc-raw-th><sc-raw-th>Must not become<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Calm<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cream-dominant surfaces, one accent color, minimal shadow<\u002Fsc-raw-td><sc-raw-td>One primary action per screen; no competing CTAs<\u002Fsc-raw-td><sc-raw-td>Passive or under-designed<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Human<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Warm neutrals, rounded corners, real language over labels<\u002Fsc-raw-td><sc-raw-td>Copy written to a person, never a \"user\"<\u002Fsc-raw-td><sc-raw-td>Cute, casual, or jokey<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Capable<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Confident type scale, tight tracking on headings<\u002Fsc-raw-td><sc-raw-td>Clear next action always visible; no dead ends<\u002Fsc-raw-td><sc-raw-td>Boastful (\"guaranteed,\" \"perfect match\")<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Inclusive<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Plain iconography, no culturally-loaded imagery<\u002Fsc-raw-td><sc-raw-td>Plain-language copy, no idioms that don't translate<\u002Fsc-raw-td><sc-raw-td>Performative diversity signaling<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Precise<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>8px spacing discipline, aligned grids, tabular numerals in admin<\u002Fsc-raw-td><sc-raw-td>Exact states (verified, pending, expired) never vague ones<\u002Fsc-raw-td><sc-raw-td>Cold or clinical<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Trustworthy<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Consistent verification badge language, visible moderation cues<\u002Fsc-raw-td><sc-raw-td>Every claim (badge, score, status) is explained on tap<\u002Fsc-raw-td><sc-raw-td>Loudly self-certifying (\"100% verified!\")<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Forward-looking<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Progress structures (timelines, bars, lifecycle chips) built into layout<\u002Fsc-raw-td><sc-raw-td>Every screen implies a next step, even empty ones<\u002Fsc-raw-td><sc-raw-td>Futuristic, glossy, or trend-driven<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n\n<h2 id=\"c\">C. Logo system<\u002Fh2>\n<p><strong>Wordmark:<\u002Fstrong> lowercase \"klinnova,\" set in a refined humanist sans (DM Sans 600, or an equivalent grotesque with humanist warmth — see E), tracking tightened to about ‑0.03em. Not serif — serif reads more editorial-magazine than Klinnova's slightly more institutional register. Not all-geometric-sans either, which would push toward the fintech/SaaS look the brief explicitly rejects.<\u002Fp>\n<p><strong>Mark:<\u002Fstrong> the Stint three-step staircase evolves into a simplified two-segment rise ending in the same recognition ring (an open ring around a small dot) rather than a filled terminus — the dot was already fixed to mean \"seen, not arrived\" for Stint, and that fix carries over unchanged. Simplifying from three segments to two makes the mark legible at 16px and less busy next to denser employer/admin chrome. This is an evolution, not a replacement, matching the brief's steer toward \"subtler and more ownable\" rather than a new metaphor.<\u002Fp>\n<div class=\"callout\">\n<p><strong>Explicitly avoided:<\u002Fstrong> medical crosses, DNA/heartbeat lines, pill shapes (healthcare); sparkle/spark glyphs (AI); literal \"K\" monograms (generic, and collides with countless K-brands); anything resembling a bridge/arch cliché for \"connection.\"<\u002Fp>\n<\u002Fdiv>\n<h4>Variants &amp; usage<\u002Fh4>\n<ul>\n<li><strong>Primary lockup<\u002Fstrong> — mark + wordmark, mark at wordmark cap-height, 10–12px gap, used in navigation and headers.<\u002Fli>\n<li><strong>Compact mark<\u002Fstrong> — mark alone, for app icon, favicon, avatar/badge contexts, loading states.<\u002Fli>\n<li><strong>Monochrome<\u002Fstrong> — single ink or single paper color, no oxblood, for stamps, printed documents, and any surface where color can't be guaranteed (fax-like PDFs, greyscale print).<\u002Fli>\n<li><strong>Small-size behavior<\u002Fstrong> — below 20px, drop the outer recognition ring (keep ring+dot only above 20px); below 14px, render as a solid dot only. Never shrink the two-segment path below 24px.<\u002Fli>\n<li><strong>Clear space<\u002Fstrong> — minimum clear space equal to the mark's own height on all sides.<\u002Fli>\n<li><strong>Minimum size<\u002Fstrong> — 16px digital, 8mm print.<\u002Fli>\n<li><strong>Misuse<\u002Fstrong> — never recolor the mark to clay or olive; never place it on busy photography without a solid tile behind it; never stretch or skew; never rebuild the wordmark in a different weight than 600.<\u002Fli>\n<\u002Ful>\n\n<h2 id=\"d\">D. Color system<\u002Fh2>\n<p>Direction C's palette: oxblood remains the single primary; the overall field lightens (cream carries more of the page than it did for Stint); clay is demoted from a secondary-brand color to a warmth cue used only as a soft surface tint; olive is held in reserve for success/support states only. No new hues are introduced.<\u002Fp>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th><\u002Fsc-raw-th><sc-raw-th>Token<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th>Role<\u002Fsc-raw-th><sc-raw-th>Contrast note<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.38 0.13 20);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--primary<\u002Fsc-raw-td><sc-raw-td>oklch(0.38 0.13 20)<\u002Fsc-raw-td><sc-raw-td>Primary actions, links, active states, focus ring base<\u002Fsc-raw-td><sc-raw-td>7.1:1 on paper — passes AA/AAA for text<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.34 0.14 20);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--primary-hover<\u002Fsc-raw-td><sc-raw-td>oklch(0.34 0.14 20)<\u002Fsc-raw-td><sc-raw-td>Hover<\u002Fsc-raw-td><sc-raw-td>Darker than primary, same hue<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.30 0.14 20);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--primary-pressed<\u002Fsc-raw-td><sc-raw-td>oklch(0.30 0.14 20)<\u002Fsc-raw-td><sc-raw-td>Pressed/active<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.965 0.015 75);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--background<\u002Fsc-raw-td><sc-raw-td>oklch(0.965 0.015 75)<\u002Fsc-raw-td><sc-raw-td>Page background, cream-dominant per Direction C<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.99 0.008 75); border:1px solid #ddd;\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--surface-elevated<\u002Fsc-raw-td><sc-raw-td>oklch(0.99 0.008 75)<\u002Fsc-raw-td><sc-raw-td>Cards, panels, modals<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.9 0.025 45);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--surface-secondary<\u002Fsc-raw-td><sc-raw-td>oklch(0.9 0.025 45)<\u002Fsc-raw-td><sc-raw-td>Clay reduced to a warmth wash — selected states, subtle section backgrounds, never a badge or button color<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.2 0.02 30);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--text-primary<\u002Fsc-raw-td><sc-raw-td>oklch(0.2 0.02 30)<\u002Fsc-raw-td><sc-raw-td>Body and heading text<\u002Fsc-raw-td><sc-raw-td>13.8:1 on background<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.5 0.02 30);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--text-muted<\u002Fsc-raw-td><sc-raw-td>oklch(0.5 0.02 30)<\u002Fsc-raw-td><sc-raw-td>Secondary text, captions<\u002Fsc-raw-td><sc-raw-td>4.6:1 on background — passes AA for text ≥14px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.9 0.015 75); border:1px solid #ddd;\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--border<\u002Fsc-raw-td><sc-raw-td>oklch(0.9 0.015 75)<\u002Fsc-raw-td><sc-raw-td>Default border, dividers<\u002Fsc-raw-td><sc-raw-td>Decorative only, not relied on for state<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.84 0.015 75); border:1px solid #ddd;\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--border-strong<\u002Fsc-raw-td><sc-raw-td>oklch(0.84 0.015 75)<\u002Fsc-raw-td><sc-raw-td>Input borders, table rules<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.52 0.11 75);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--success<\u002Fsc-raw-td><sc-raw-td>oklch(0.52 0.11 75)<\u002Fsc-raw-td><sc-raw-td>Verified, approved, hired<\u002Fsc-raw-td><sc-raw-td>4.9:1 on background<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.62 0.13 65);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--warning<\u002Fsc-raw-td><sc-raw-td>oklch(0.62 0.13 65)<\u002Fsc-raw-td><sc-raw-td>Pending, needs attention<\u002Fsc-raw-td><sc-raw-td>Text pairs with dark ink, not white, for AA<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.5 0.16 25);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--error<\u002Fsc-raw-td><sc-raw-td>oklch(0.5 0.16 25)<\u002Fsc-raw-td><sc-raw-td>Rejected, expired, destructive<\u002Fsc-raw-td><sc-raw-td>Deliberately a warmer red than oxblood so the two are never confused; 5.1:1 on background<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.55 0.08 230);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--info<\u002Fsc-raw-td><sc-raw-td>oklch(0.55 0.08 230)<\u002Fsc-raw-td><sc-raw-td>Neutral system notices only (maintenance, policy updates) — the one deliberate exception to \"no blue,\" used at low saturation and only where oxblood/olive/error would misread as a brand or status signal<\u002Fsc-raw-td><sc-raw-td>4.7:1 on background<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td class=\"swatch\"><span class=\"sw\" style=\"background:oklch(0.38 0.13 20 / 30%);\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td>--focus-ring<\u002Fsc-raw-td><sc-raw-td>oklch(0.38 0.13 20 / 30%)<\u002Fsc-raw-td><sc-raw-td>2px focus ring on all interactive elements<\u002Fsc-raw-td><sc-raw-td>Always paired with a visible border shift, not color alone<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n\n<h2 id=\"e\">E. Typography<\u002Fh2>\n<p><strong>Product UI:<\u002Fstrong> a refined humanist sans — DM Sans (already in the inherited system) as the default, weights 400/500/600/700. It reads warm without being decorative, and its numerals stay legible at small sizes, which matters for the employer/admin tables in section H.<\u002Fp>\n<p><strong>Wordmark:<\u002Fstrong> the same sans, weight 600, tightened tracking (‑0.03em), set lowercase always. No serif for Klinnova — this is the one deliberate departure from Direction A, made because a serif wordmark suits a single consumer-facing product (Stint) more than an employer-facing platform brand.<\u002Fp>\n<h4>Scale<\u002Fh4>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Token<\u002Fsc-raw-th><sc-raw-th>Size<\u002Fsc-raw-th><sc-raw-th>Weight<\u002Fsc-raw-th><sc-raw-th>Line-height<\u002Fsc-raw-th><sc-raw-th>Use<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>display<\u002Fsc-raw-td><sc-raw-td>40–56px, fluid<\u002Fsc-raw-td><sc-raw-td>700<\u002Fsc-raw-td><sc-raw-td>1.1<\u002Fsc-raw-td><sc-raw-td>Marketing hero, wordmark lockups<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>h1<\u002Fsc-raw-td><sc-raw-td>28–32px<\u002Fsc-raw-td><sc-raw-td>700<\u002Fsc-raw-td><sc-raw-td>1.2<\u002Fsc-raw-td><sc-raw-td>Page titles<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>h2<\u002Fsc-raw-td><sc-raw-td>22–24px<\u002Fsc-raw-td><sc-raw-td>700<\u002Fsc-raw-td><sc-raw-td>1.25<\u002Fsc-raw-td><sc-raw-td>Section headers<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>h3<\u002Fsc-raw-td><sc-raw-td>17–18px<\u002Fsc-raw-td><sc-raw-td>600<\u002Fsc-raw-td><sc-raw-td>1.35<\u002Fsc-raw-td><sc-raw-td>Card titles, subsections<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>body<\u002Fsc-raw-td><sc-raw-td>15px<\u002Fsc-raw-td><sc-raw-td>400<\u002Fsc-raw-td><sc-raw-td>1.65<\u002Fsc-raw-td><sc-raw-td>Default copy<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>body-dense<\u002Fsc-raw-td><sc-raw-td>14px<\u002Fsc-raw-td><sc-raw-td>400<\u002Fsc-raw-td><sc-raw-td>1.5<\u002Fsc-raw-td><sc-raw-td>Admin tables, dense forms<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>caption<\u002Fsc-raw-td><sc-raw-td>11–12px<\u002Fsc-raw-td><sc-raw-td>600<\u002Fsc-raw-td><sc-raw-td>1.3, tracking 0.05–0.08em<\u002Fsc-raw-td><sc-raw-td>Eyebrows, badges, timestamps<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<p><strong>Multilingual:<\u002Fstrong> DM Sans covers Latin extended and Cyrillic; if Arabic or other non-Latin scripts enter scope, pair with a matching-weight system font per script rather than forcing DM Sans, and re-test line-height (non-Latin scripts often need +0.1–0.15 more). <strong>Numeric readability:<\u002Fstrong> employer/admin tables use tabular (fixed-width) numerals so salary, distance and date columns align vertically. <strong>Mobile:<\u002Fstrong> body text never drops below 15px on candidate screens; line-length capped around 60 characters for readability on narrow viewports.<\u002Fp>\n\n<h2 id=\"f\">F. Spacing and layout<\u002Fh2>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Token<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th>Use<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>space-1<\u002Fsc-raw-td><sc-raw-td>4px<\u002Fsc-raw-td><sc-raw-td>Icon-to-label gaps<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>space-2<\u002Fsc-raw-td><sc-raw-td>8px<\u002Fsc-raw-td><sc-raw-td>Base unit, chip padding<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>space-4<\u002Fsc-raw-td><sc-raw-td>16px<\u002Fsc-raw-td><sc-raw-td>Related field groups<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>space-6<\u002Fsc-raw-td><sc-raw-td>24px<\u002Fsc-raw-td><sc-raw-td>Card padding (mobile), gap between panels<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>space-8<\u002Fsc-raw-td><sc-raw-td>32px<\u002Fsc-raw-td><sc-raw-td>Card padding (desktop)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>space-10<\u002Fsc-raw-td><sc-raw-td>56px<\u002Fsc-raw-td><sc-raw-td>Section spacing<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>space-12<\u002Fsc-raw-td><sc-raw-td>72px<\u002Fsc-raw-td><sc-raw-td>Hero/top-of-page breathing room<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<p><strong>Containers:<\u002Fstrong> candidate mobile flows are single-column, no max-width constraint beyond the device; marketing/document surfaces cap at 1152px; employer/admin desktop layouts cap at 1440px with a persistent sidebar (see J). <strong>Gutters:<\u002Fstrong> 16px on candidate mobile (360–430px), 24px on tablet, 40px on desktop marketing, 32px inside employer/admin panels. <strong>Candidate rules:<\u002Fstrong> one primary action per screen, always docked to the bottom or immediately after the relevant content, minimum 44px touch targets, no more than one decision per screen during onboarding. <strong>Employer/admin rules:<\u002Fstrong> density is allowed (tighter row height, smaller type per the body-dense token) but must stay on the 8px grid — no ad hoc spacing, and no more than three data density levels across the whole admin surface (comfortable / standard / dense) so tables stay predictable.<\u002Fp>\n\n<h2 id=\"g\">G. Radius, borders and elevation<\u002Fh2>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Token<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th>Use<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>radius-sm<\u002Fsc-raw-td><sc-raw-td>8px<\u002Fsc-raw-td><sc-raw-td>Chips, small buttons, badges<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>radius-md<\u002Fsc-raw-td><sc-raw-td>12px<\u002Fsc-raw-td><sc-raw-td>Inputs, list rows<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>radius-lg<\u002Fsc-raw-td><sc-raw-td>16px<\u002Fsc-raw-td><sc-raw-td>Cards, panels<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>radius-xl<\u002Fsc-raw-td><sc-raw-td>22px<\u002Fsc-raw-td><sc-raw-td>Modals, hero panels, app icon tile<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<p><strong>Borders:<\u002Fstrong> 1px, low-contrast (--border), reserved for inputs and table rules; cards prefer shadow over border where possible. <strong>Shadow:<\u002Fstrong> two tiers only — shadow-sm for resting cards (a soft 12px blur), shadow-md for modals and popovers (a wider 30px blur); nothing heavier, no colored shadows. <strong>Cards:<\u002Fstrong> radius-lg, shadow-sm at rest, no hover lift on non-interactive cards (interactive ones — job cards, vacancy rows — get a 1px translateY on hover, matching Direction A's restraint). <strong>Inputs:<\u002Fstrong> radius-md, 1px border-strong at rest, 4px focus-ring glow + border shift to primary on focus, never color-only. <strong>Dialogs:<\u002Fstrong> radius-xl, shadow-md, centered on desktop, bottom sheet on mobile (see H, mobile drawer). <strong>Sticky navigation:<\u002Fstrong> the candidate bottom nav and employer top bar get a 1px bottom/top border plus shadow-sm on scroll only, staying flat at rest to avoid visual noise. Principle unchanged from Stint: spacing and hierarchy carry the design before any decoration does.<\u002Fp>\n\n<h2 id=\"h\">H. Component visual language<\u002Fh2>\n<p>Every component follows the same order of operations: establish hierarchy with size/weight/spacing first, color second (oxblood for the one primary action only), decoration last and rarely.<\u002Fp>\n<h3>Primary button<\u002Fh3>\n<p>Oxblood fill, paper text, radius-sm, 44px min height on mobile. Hover: --primary-hover fill + 1px lift. Pressed: --primary-pressed, lift releases. Focus: 2px focus-ring offset by radius. Disabled: 0.6 opacity, no pointer events. One primary button visible per screen.<\u002Fp>\n<h3>Secondary button<\u002Fh3>\n<p>1px border-strong, ink text, transparent fill. Hover: border shifts to primary at 40%, background tints --surface-secondary at 30%. Used for the second-most-important action, never paired with a second primary.<\u002Fp>\n<h3>Destructive button<\u002Fh3>\n<p>1px --error border, --error text, transparent fill until hover (then --error at 8% fill). Never filled solid by default — a filled destructive button is reserved for a final confirmation step only, to avoid accidental heavy visual weight on delete-class actions.<\u002Fp>\n<h3>Icon button<\u002Fh3>\n<p>40×40px minimum, radius-sm, transparent until hover (--surface-secondary at 20%). Icon-only buttons always carry an aria-label; never the sole way to reach a critical action.<\u002Fp>\n<h3>Text input / textarea<\u002Fh3>\n<p>radius-md, 1px border-strong, 14px vertical / 16px horizontal padding, placeholder at --text-muted. Focus: border to primary at 55%, 4px glow ring. Error: border to --error at 60%, helper text switches to --error, error is announced via aria-describedby, never color alone.<\u002Fp>\n<h3>Select / combobox<\u002Fh3>\n<p>Same shell as text input; chevron icon at --text-muted; open state matches input focus state; options list radius-md, shadow-sm, 8px vertical padding between options.<\u002Fp>\n<h3>Checkbox / radio group<\u002Fh3>\n<p>20×20px target visually, 44px hit area. Checked: primary fill, paper check/dot. Radio groups for mutually exclusive choices only (matches existing German-level pattern); checkboxes for multi-select (matches existing chip pattern for languages/interests).<\u002Fp>\n<h3>Chips<\u002Fh3>\n<p>radius-sm (or full pill for filter chips), 9px/16px padding. Unselected: --surface-elevated fill, border-strong border. Selected: --surface-secondary fill, 1.5px primary border, primary text. Disabled: 0.5 opacity.<\u002Fp>\n<h3>Badges &amp; status pills<\u002Fh3>\n<p>Fixed vocabulary, never freeform color: success (verified/hired/approved), warning (pending/needs review), error (rejected/expired), neutral (draft/informational). Text label always present — color is a reinforcement, never the only signal.<\u002Fp>\n<h3>Progress indicator<\u002Fh3>\n<p>The one place the step motif is allowed to appear literally, and only during onboarding: a slim segmented bar, filled segments in primary, current segment outlined, future segments border-strong. Elsewhere, progress is communicated by layout and state (a timeline, a lifecycle chip, a completion count) rather than a redrawn step graphic — this is the brief's core instruction and the biggest procedural change from the Stint system.<\u002Fp>\n<h3>Job card<\u002Fh3>\n<p>radius-lg, shadow-sm, employer name + verified badge at top, match reasoning as a single --surface-secondary strip, salary as the single largest number on the card, distance/transit/shift as chips, one primary action (apply) plus one icon-button (save). Same structure as the Stint spec (see the earlier handoff doc's job-card section) — unchanged, since the review never flagged it.<\u002Fp>\n<h3>Employer verification badge<\u002Fh3>\n<p>A small filled-outline badge, olive success color, label \"Verified employer,\" always tappable to a one-line explanation of what verification checked. Never a large seal or shield graphic — trust is stated plainly, not decorated (see N).<\u002Fp>\n<h3>Application status timeline<\u002Fh3>\n<p>Vertical on mobile, horizontal on desktop admin views. Filled dots + solid connector for completed steps, outlined dot + dashed connector for the current step, empty outline for future steps — directly reusing the Stint pattern, which already embodies \"progress without repeating steps graphics everywhere,\" just not duplicated elsewhere in the UI.<\u002Fp>\n<h3>Alerts<\u002Fh3>\n<p>radius-md, left-aligned icon, no left color bar (avoids the \"colored-border-accent\" trope) — instead a full soft-tint background at 8–10% of the status color. Dismissible unless it blocks a required action.<\u002Fp>\n<h3>Empty states<\u002Fh3>\n<p>Icon (simplified, using the mark's line language, never a full illustration), one line naming the situation, one line naming the next action, one button. No stock illustration.<\u002Fp>\n<h3>Modal / dialog<\u002Fh3>\n<p>radius-xl, shadow-md, max-width 480px on desktop, centered; on mobile, becomes a bottom sheet (see mobile drawer). Title + body + one primary / one secondary action, right-aligned on desktop, stacked full-width on mobile.<\u002Fp>\n<h3>Mobile drawer<\u002Fh3>\n<p>Slides from bottom, radius-xl on top corners only, drag handle affordance, backdrop at ink/40%. Used for filters, quick actions, and any modal content on candidate mobile screens.<\u002Fp>\n<h3>Navigation header<\u002Fh3>\n<p>Candidate: minimal — logo/mark left, account entry right, no persistent tab bar in the header (tabs live in the bottom nav). Employer: logo/mark + workspace switcher left, notifications + account right, sits above the sidebar.<\u002Fp>\n<h3>Candidate bottom navigation<\u002Fh3>\n<p>Recommended — see I. Four items max, icon + label, active item in primary color with the icon's filled variant, inactive items at --text-muted.<\u002Fp>\n<h3>Employer sidebar / top navigation<\u002Fh3>\n<p>Recommended: left sidebar on desktop (see J), collapsing to a top bar with an overflow \"more\" menu at ≤430px.<\u002Fp>\n<h3>Tables / lists<\u002Fh3>\n<p>Repeating <code>thead<\u002Fcode>, tabular numerals, 1px border-strong row dividers only (no full cell borders), row hover at --surface-secondary 15%, sortable columns marked with a small chevron, sticky header on scroll.<\u002Fp>\n<h3>Skeleton / loading state<\u002Fh3>\n<p>No spinners. Shape-matched skeleton blocks in --border color with a slow shimmer (see K); for longer waits, the Stint-style segmented progress bar; the step-path travel animation is reserved for candidate-facing onboarding/matching moments only, not reused as a generic admin loading state.<\u002Fp>\n\n<h2 id=\"i\">I. Candidate information architecture<\u002Fh2>\n<p><strong>Recommended model:<\u002Fstrong> a four-item bottom navigation — Matches, Applications, Profile, Account — is the right shape here; it matches the four things a candidate actually returns to, and keeps every top-level destination one tap away, which matters more for this audience than a deeper hierarchy would.<\u002Fp>\n<ul>\n<li><strong>Matches<\u002Fstrong> — default landing tab after onboarding; filters live in a mobile drawer, not the header.<\u002Fli>\n<li><strong>Applications<\u002Fstrong> — list of applied jobs, each row showing its current timeline stage as a compact status chip.<\u002Fli>\n<li><strong>Profile<\u002Fstrong> — the staged information from onboarding (language, availability, later: experience, phone, CV) plus a completion indicator; this is where \"progress\" becomes literal and personal.<\u002Fli>\n<li><strong>Account<\u002Fstrong> — settings, notifications, and legal/data controls including export and delete. Export/delete sit at the bottom of Account under a clearly labeled \"Your data\" group, in plain secondary buttons — deliberately not surfaced as bottom-nav items or promoted with any visual weight, so they never compete with the core loop.<\u002Fli>\n<\u002Ful>\n<p><strong>Back-navigation:<\u002Fstrong> a top-left back chevron on any screen reached by drilling into a list item (a specific application, a specific match); tab switches never push a back button. <strong>Empty-state guidance:<\u002Fstrong> every tab's empty state names the next action (see H, empty states) rather than just stating absence.<\u002Fp>\n\n<h2 id=\"j\">J. Employer information architecture<\u002Fh2>\n<p><strong>Recommended model:<\u002Fstrong> a left sidebar on desktop, not a top nav — Home, Vacancies, Applications, Verification, Account. A sidebar scales better than a top bar as Klinnova adds more employer tooling over time, and keeps the workspace switcher and account entry visually separated from primary navigation.<\u002Fp>\n<ul>\n<li><strong>Home<\u002Fstrong> — a dashboard summarizing open vacancies, new applications, and anything needing verification action.<\u002Fli>\n<li><strong>Vacancies<\u002Fstrong> — replace the term \"drafts\" with explicit lifecycle states: <strong>Draft → Published → Paused → Filled → Closed<\u002Fstrong>. \"Draft\" alone told an employer nothing about whether a posting was ready; naming every state removes the ambiguity.<\u002Fli>\n<li><strong>Applications<\u002Fstrong> — grouped by vacancy, sortable table, status timeline visible per row without opening it.<\u002Fli>\n<li><strong>Verification<\u002Fstrong> — the employer's own trust status and any pending document requests; kept as its own top-level item rather than buried in Account, because it's an active task, not a settings page.<\u002Fli>\n<li><strong>Account<\u002Fstrong> — billing, team members, notification preferences.<\u002Fli>\n<\u002Ful>\n<p><strong>Mobile fallback:<\u002Fstrong> the sidebar collapses to a top bar with a hamburger-style overflow menu below 430px; core actions (view an application, approve/reject) remain reachable, but vacancy creation and bulk table actions are explicitly desktop-first and show a \"best viewed on desktop\" notice on mobile rather than a cramped rebuild. <strong>360–430px overflow:<\u002Fstrong> tables collapse to stacked cards (one per row) below 600px, with the two or three highest-priority columns shown and the rest behind a \"details\" expand.<\u002Fp>\n\n<h2 id=\"k\">K. Motion<\u002Fh2>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Token<\u002Fsc-raw-th><sc-raw-th>Duration<\u002Fsc-raw-th><sc-raw-th>Easing<\u002Fsc-raw-th><sc-raw-th>Use<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>motion-fast<\u002Fsc-raw-td><sc-raw-td>160ms<\u002Fsc-raw-td><sc-raw-td>ease-out<\u002Fsc-raw-td><sc-raw-td>Hover color/border shifts<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>motion-base<\u002Fsc-raw-td><sc-raw-td>200ms<\u002Fsc-raw-td><sc-raw-td>ease-out<\u002Fsc-raw-td><sc-raw-td>Button/card lift, focus ring<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>motion-moderate<\u002Fsc-raw-td><sc-raw-td>320ms<\u002Fsc-raw-td><sc-raw-td>cubic-bezier(0.2,0.8,0.2,1)<\u002Fsc-raw-td><sc-raw-td>Panel open, drawer slide<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>motion-entrance<\u002Fsc-raw-td><sc-raw-td>360–460ms<\u002Fsc-raw-td><sc-raw-td>ease-out<\u002Fsc-raw-td><sc-raw-td>First-paint fade-rise, staggered by 60ms per item<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<p><strong>Progress motion<\u002Fstrong> is the one place animation is allowed to be literal and sustained: the segmented onboarding bar fills continuously rather than jumping between steps; a loading wait uses the existing step-path traveling marker only where the wait itself represents matching/searching, not as decoration on unrelated waits. <strong>Hover:<\u002Fstrong> 1px lift + shadow deepen on interactive cards only, never on static content. <strong>Page transitions:<\u002Fstrong> simple cross-fade, no slide/parallax between top-level tabs. <strong>Reduced motion:<\u002Fstrong> every animation above is disabled under <code>prefers-reduced-motion: reduce<\u002Fcode>, replaced with an instant state change; the segmented progress bar still fills, just without the animated transition. No bounce, no overshoot, no celebratory confetti/scale-pop — consistent with the brief's explicit instruction.<\u002Fp>\n\n<h2 id=\"l\">L. Iconography and illustration<\u002Fh2>\n<p><strong>Icon style:<\u002Fstrong> line icons, 1.75px stroke, round caps, 24×24px grid — continuing the inherited Lucide-style language rather than introducing a second icon system. <strong>Corner language:<\u002Fstrong> icons should echo the mark's rounded, slightly soft corner treatment rather than sharp geometric icon sets. <strong>When used:<\u002Fstrong> functional wayfinding (nav, status, actions) only — never as decoration next to headings, never as a replacement for a real verification/trust explanation. <strong>Illustration:<\u002Fstrong> avoided by default. If a specific moment earns one (the \"you got the job\" celebration screen, for instance), it should be a simple line-drawn scene in the mark's own stroke language — a hand, a doorway, a single figure — never a generic corporate-blob or flat-character illustration, and never a stand-in for real photography once employer/workplace photos exist.<\u002Fp>\n\n<h2 id=\"m\">M. Voice and microcopy<\u002Fh2>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Moment<\u002Fsc-raw-th><sc-raw-th>Copy<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Registration<\u002Fsc-raw-td><sc-raw-td>\"Let's get you set up. It takes about two minutes.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Onboarding (skills/CV step)<\u002Fsc-raw-td><sc-raw-td>\"Let's start with what you can do.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Matching<\u002Fsc-raw-td><sc-raw-td>\"We'll help you tell your story — here's what fits so far.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Ineligible job<\u002Fsc-raw-td><sc-raw-td>\"This one needs a work permit you don't have yet. Here's what would qualify you.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Application success<\u002Fsc-raw-td><sc-raw-td>\"Sent. [Employer] usually responds within a day.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Rejection<\u002Fsc-raw-td><sc-raw-td>\"This one wasn't the right fit. Let's keep moving — three more matches below.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Interview outcome (positive)<\u002Fsc-raw-td><sc-raw-td>\"You got the job. Your first shift is [date]. We'll remind you the day before.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Employer verification<\u002Fsc-raw-td><sc-raw-td>\"We're confirming a few details before your vacancies go live. Most checks finish within one business day.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Vacancy creation<\u002Fsc-raw-td><sc-raw-td>\"Describe the role the way you'd explain it to someone on their first day.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Empty state (no matches)<\u002Fsc-raw-td><sc-raw-td>\"Nothing here yet. Widen your radius or add another job type.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Error state<\u002Fsc-raw-td><sc-raw-td>\"That didn't go through. Nothing was lost — try again.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Delete account<\u002Fsc-raw-td><sc-raw-td>\"Deleting your account removes your profile and applications permanently. Anything you've already agreed to with an employer stays with them, as required by law.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Private beta messaging<\u002Fsc-raw-td><sc-raw-td>\"Klinnova is in a private beta in Berlin. We're onboarding employers and candidates gradually to get every match right.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<p>Words permanently retired from the vocabulary: \"unskilled worker,\" \"low-skilled,\" \"AI-powered,\" \"perfect match,\" \"guaranteed job.\" Match language stays probabilistic and specific (\"92% match, English accepted\") rather than absolute.<\u002Fp>\n\n<h2 id=\"n\">N. Trust design<\u002Fh2>\n<p>Trust is stated once, plainly, and made tappable for detail — never re-asserted with extra badges, shields, or exclamation points.<\u002Fp>\n<ul>\n<li><strong>Verified employer<\u002Fstrong> — a single olive badge with the word \"Verified,\" tapping it shows what was checked (business registration, prior hiring history) and when.<\u002Fli>\n<li><strong>Legitimate vacancy<\u002Fstrong> — inherits the employer's verification status; a vacancy from an unverified employer is visually unbadged rather than negatively flagged, keeping the signal purely additive.<\u002Fli>\n<li><strong>Language requirement<\u002Fstrong> — stated as a plain chip (\"English accepted,\" \"Basic German\"), never a test score or percentage.<\u002Fli>\n<li><strong>Work authorization<\u002Fstrong> — handled at the matching layer, surfaced to the candidate only when it excludes them from a specific job, with a plain explanation (see M, ineligible job).<\u002Fli>\n<li><strong>Privacy<\u002Fstrong> — a visible, plainly worded data section in Account (see I); no dark patterns around export/delete.<\u002Fli>\n<li><strong>Moderation<\u002Fstrong> — a quiet, neutral \"under review\" state for flagged content, never a public warning label.<\u002Fli>\n<li><strong>Outcome history<\u002Fstrong> — for employers, a simple \"response time\" and \"hire rate\" stat on their profile, sourced from real activity, never self-reported.<\u002Fli>\n<\u002Ful>\n\n<h2 id=\"o\">O. Accessibility<\u002Fh2>\n<ul>\n<li>Minimum contrast 4.5:1 for body text, 3:1 for large text (≥24px) and icons — all palette pairings in section D are pre-checked to these minimums.<\u002Fli>\n<li>Focus states: visible 2px ring in all cases, never removed, never color-only.<\u002Fli>\n<li>Touch targets: 44×44px minimum on candidate mobile, 36×36px minimum in dense employer/admin tables (with a documented exception, since admin is mouse-first).<\u002Fli>\n<li>Form labels: always visible, never placeholder-only; every input has a programmatically associated label.<\u002Fli>\n<li>Error association: errors linked via aria-describedby, focus moves to the first error on submit.<\u002Fli>\n<li>Status communicated redundantly by color, icon, and text label — never color alone.<\u002Fli>\n<li>Reduced motion respected everywhere per section K.<\u002Fli>\n<li>Mobile text never below 15px for body copy.<\u002Fli>\n<li>Layout tested to remain usable at 200% browser zoom without horizontal scroll on candidate flows.<\u002Fli>\n<\u002Ful>\n\n<h2 id=\"p\">P. Responsive behavior<\u002Fh2>\n<h4>Candidate<\u002Fh4>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Width<\u002Fsc-raw-th><sc-raw-th>Behavior<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>360px<\u002Fsc-raw-td><sc-raw-td>Single column, bottom nav labels may shrink to icon-only if needed, forms stack fully<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>375–390px<\u002Fsc-raw-td><sc-raw-td>Baseline design target; all candidate mockups in this document are built to this range<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>430px<\u002Fsc-raw-td><sc-raw-td>Slightly more breathing room, no layout change<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Tablet<\u002Fsc-raw-td><sc-raw-td>Candidate flows stay single-column, centered with side padding, capped at ~600px reading width<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Desktop<\u002Fsc-raw-td><sc-raw-td>Candidate web experience remains centered single-column (never stretched to a dashboard layout)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<h4>Employer/admin<\u002Fh4>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Width<\u002Fsc-raw-th><sc-raw-th>Behavior<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Desktop<\u002Fsc-raw-td><sc-raw-td>Primary target: sidebar + main content, full tables, multi-column forms<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Tablet<\u002Fsc-raw-td><sc-raw-td>Sidebar collapses to icons-only, tables scroll horizontally with sticky first column<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>430px fallback<\u002Fsc-raw-td><sc-raw-td>Sidebar becomes a top bar + overflow menu, tables become stacked cards, vacancy creation shows a desktop-recommended notice<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>390px fallback<\u002Fsc-raw-td><sc-raw-td>Same as 430px, tighter padding; bulk actions hidden behind a single \"actions\" menu<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<p>Across both: modals become bottom sheets below tablet width; sticky primary actions (apply, publish, approve) stay docked to the viewport bottom on mobile.<\u002Fp>\n\n<h2 id=\"q\">Q. Migration guidance<\u002Fh2>\n<p>Design-only classification — no code implied. Legend: <span class=\"tag tag-rename\">rename<\u002Fspan> label/copy only — <span class=\"tag tag-restyle\">restyle<\u002Fspan> visual values change, structure doesn't — <span class=\"tag tag-restructure\">restructure<\u002Fspan> layout/hierarchy changes — <span class=\"tag tag-defer\">defer<\u002Fspan> leave untouched for now.<\u002Fp>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Element<\u002Fsc-raw-th><sc-raw-th>Classification<\u002Fsc-raw-th><sc-raw-th>Note<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Wordmark &amp; word \"Stint\" in copy<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-restructure\">restructure<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>New name, new set typography — not a find-and-replace<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>App icon / mark<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-restyle\">restyle<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Same construction logic (steps + recognition ring), simplified to two segments<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Color tokens<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-restyle\">restyle<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Same token names, lightened values per section D<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Type tokens<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-rename\">rename<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Same scale, same DM Sans family, only the wordmark treatment changes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Button / input / chip components<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-defer\">defer<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Structure and states unchanged — only inherit new color tokens automatically<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Onboarding flow &amp; copy<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-restyle\">restyle<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Same six-step structure; copy adjusted per section M<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Job card<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-defer\">defer<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>No changes requested or needed<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>\"Vacancy drafts\" terminology<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-rename\">rename<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Replace with explicit lifecycle states (section J) — copy-only, no new screens<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Employer/admin navigation model<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-restructure\">restructure<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Needs Development input on whether a sidebar is feasible given current routing — see open questions<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Trust/verification badge component<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-defer\">defer<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Existing pattern already matches section N; only recolor<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Progress indicator usage<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-restructure\">restructure<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Scope the step-path graphic down to onboarding only per section H — remove it from any place it was decoratively repeated<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Domain, legal footer, account deletion flow<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-defer\">defer<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Not a design concern for this rename — flagged for Development/legal directly<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n\n<h2 id=\"r\">R. Design tokens<\u002Fh2>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Category<\u002Fsc-raw-th><sc-raw-th>Token<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"4\">Color<\u002Fsc-raw-td><sc-raw-td>color.primary<\u002Fsc-raw-td><sc-raw-td>oklch(0.38 0.13 20)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>color.background<\u002Fsc-raw-td><sc-raw-td>oklch(0.965 0.015 75)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>color.text.primary<\u002Fsc-raw-td><sc-raw-td>oklch(0.2 0.02 30)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>color.success<\u002Fsc-raw-td><sc-raw-td>oklch(0.52 0.11 75)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"2\">Typography<\u002Fsc-raw-td><sc-raw-td>font.family.ui<\u002Fsc-raw-td><sc-raw-td>\"DM Sans\", sans-serif<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>font.size.body<\u002Fsc-raw-td><sc-raw-td>15px / 1.65<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"2\">Spacing<\u002Fsc-raw-td><sc-raw-td>space.4<\u002Fsc-raw-td><sc-raw-td>16px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>space.8<\u002Fsc-raw-td><sc-raw-td>32px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"2\">Radius<\u002Fsc-raw-td><sc-raw-td>radius.md<\u002Fsc-raw-td><sc-raw-td>12px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>radius.xl<\u002Fsc-raw-td><sc-raw-td>22px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Border<\u002Fsc-raw-td><sc-raw-td>border.default<\u002Fsc-raw-td><sc-raw-td>1px solid oklch(0.9 0.015 75)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"2\">Shadow<\u002Fsc-raw-td><sc-raw-td>shadow.sm<\u002Fsc-raw-td><sc-raw-td>0 4px 12px oklch(0.3 0.02 30 / 8%)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>shadow.md<\u002Fsc-raw-td><sc-raw-td>0 12px 30px oklch(0.3 0.02 30 / 12%)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"2\">Motion<\u002Fsc-raw-td><sc-raw-td>motion.base<\u002Fsc-raw-td><sc-raw-td>200ms ease-out<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>motion.entrance<\u002Fsc-raw-td><sc-raw-td>360ms ease-out<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"3\">Breakpoint<\u002Fsc-raw-td><sc-raw-td>bp.mobile<\u002Fsc-raw-td><sc-raw-td>360–430px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>bp.tablet<\u002Fsc-raw-td><sc-raw-td>431–1024px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>bp.desktop<\u002Fsc-raw-td><sc-raw-td>1025px+<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"3\">Z-index<\u002Fsc-raw-td><sc-raw-td>z.dropdown<\u002Fsc-raw-td><sc-raw-td>100<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>z.drawer<\u002Fsc-raw-td><sc-raw-td>200<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>z.modal<\u002Fsc-raw-td><sc-raw-td>300<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Focus<\u002Fsc-raw-td><sc-raw-td>focus.ring<\u002Fsc-raw-td><sc-raw-td>2px solid oklch(0.38 0.13 20 / 30%), 2px offset<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td rowspan=\"2\">Touch target<\u002Fsc-raw-td><sc-raw-td>touch.candidate<\u002Fsc-raw-td><sc-raw-td>44px minimum<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>touch.admin<\u002Fsc-raw-td><sc-raw-td>36px minimum<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n\n<h2 id=\"s\">S. Deliverables index<\u002Fh2>\n<ol>\n<li>Brand summary — section A<\u002Fli>\n<li>Design principles — section B<\u002Fli>\n<li>Logo direction — section C<\u002Fli>\n<li>Palette — section D<\u002Fli>\n<li>Typography — section E<\u002Fli>\n<li>Layout system — sections F–G<\u002Fli>\n<li>Component system — section H<\u002Fli>\n<li>Candidate navigation — section I<\u002Fli>\n<li>Employer/admin navigation — section J<\u002Fli>\n<li>Motion — section K<\u002Fli>\n<li>Voice/microcopy — section M<\u002Fli>\n<li>Accessibility rules — section O<\u002Fli>\n<li>Responsive rules — section P<\u002Fli>\n<li>Design tokens — section R<\u002Fli>\n<li>Migration matrix — section Q<\u002Fli>\n<li>Open questions for founder review — below<\u002Fli>\n<li>Open questions for Development review — below<\u002Fli>\n<\u002Fol>\n\n<h2>Open questions for founder review<\u002Fh2>\n<ul>\n<li>Is retiring \"One step closer\" as a printed tagline (while keeping it as an internal principle) acceptable, or should Klinnova keep a printed tagline at all — and if so, which line?<\u002Fli>\n<li>Does the four-pillar framing (Seen, Progress, Dignity, Trust) read right for an employer audience, or does \"Seen\" need employer-side language of its own?<\u002Fli>\n<li>Is the simplified two-segment mark distinctive enough, or does it need to diverge further from the Stint staircase to feel like a genuinely new company?<\u002Fli>\n<li>Should the info/blue exception in the palette (section D) be removed entirely in favor of routing all system notices through neutral ink/olive, even at the cost of a slightly less legible \"informational\" category?<\u002Fli>\n<\u002Ful>\n<h2>Open questions for Development review<\u002Fh2>\n<ul>\n<li>Is a left-sidebar employer/admin navigation (section J) feasible given the current routing structure, or does it require a larger refactor than this rename should trigger during beta?<\u002Fli>\n<li>Can vacancy lifecycle states (Draft/Published/Paused/Filled/Closed) be modeled as a single field today, or does \"Vacancy drafts\" reflect an existing data-model constraint that needs its own discussion before the copy change ships?<\u002Fli>\n<li>Are tabular/monospace numeral fonts available in the current font-loading setup for admin tables, or does that require a new font weight/file to be added?<\u002Fli>\n<li>Does the reduced-motion media query already gate existing animations, or does this system's motion tokens (section K) need net-new implementation work to respect it?<\u002Fli>\n<\u002Ful>\n\n<\u002Fdiv>\n<\u002Fdoc-page>\n]]&gt;\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
