<h2>Confirm your email address</h2>
<p>
  Follow the link below to confirm this email address and finish signing up.
</p>
<p>
  <!--
    Direct token_hash link to our own /auth/confirm interstitial — never
    ConfirmationURL, which points at GoTrue's /auth/v1/verify and consumes
    the one-time token on the first GET it receives, including automated
    email-link-prefetch/security scanners, before a human ever clicks
    (C4G-R). RedirectTo already carries our own ?next=<intent> — always
    present, even when empty, since registerAction always sets it — so
    appending further params with `&` is always syntactically safe.
  -->
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=signup"
    >Confirm email address</a
  >
</p>
